<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FêmeIA.Co - Conversor DICOM/Nifti</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Using itk-wasm for browser-based medical image conversion -->
    <script src="https://cdn.jsdelivr.net/npm/itk-wasm@1.0.0-b.150/dist/umd/itk-wasm.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">FêmeIA.Co <span>✨</span></h1>
            <p class="subtitle">A elegância em conversão de imagens médicas (DICOM ⟷ NIfTI)</p>
            <p class="authors">Por Dr. Heraldo O. Mello Neto <br><span class="contributor">Contribuição: Klaus Schumacher</span></p>
        </header>

        <main>
            <div class="converter-box">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('d2n')">DICOM para NIfTI</button>
                    <button class="tab" onclick="switchTab('n2d')">NIfTI para DICOM</button>
                </div>

                <div class="upload-area" id="drop-zone">
                    <div class="upload-icon">🌸</div>
                    <p>Arraste seus arquivos aqui ou <strong>clique para selecionar</strong></p>
                    <input type="file" id="file-input" multiple hidden>
                </div>

                <div class="actions">
                    <button id="convert-btn" class="primary-btn" disabled>Iniciar Conversão Mágica ✨</button>
                </div>

                <div id="status-area" class="status-area hidden">
                    <div class="progress-bar"><div class="progress" id="progress"></div></div>
                    <p id="status-text">Aguardando arquivos...</p>
                </div>
            </div>
        </main>

        <footer>
            <p>100% Client-Side. Seguro, rápido e superior. 💅</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
